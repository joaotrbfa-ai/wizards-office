# Wizards Office Workflow Landing Page Section Iteration

## Action

Follow the landing-page-section-iteration workflow:
1. Edit or refactor multiple React component files under src/components/home/ to update section layout/content.
2. Update src/app/(site)/page.tsx to assemble or reorder sections.
3. Modify Sanity schema/types/queries (src/sanity/schemas/, src/sanity/types.ts, src/sanity/queries.ts) to support new/changed content.
4. Adjust data population scripts or seeds if needed (e.g., scripts/seed-*.mjs).
5. Update tasks/todo.md to reflect pending or completed work.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/app/(site)/page.tsx, src/components/home/*.tsx, src/sanity/queries.ts

